# PR 门禁：类型 / lint / 单测 / 生产构建
#
# 为什么单独一个 workflow：`.github/workflows/db-parity.yml` 只跑三库方言矩阵，
# 类型、lint、单测、build 全都不在 PR 门禁里 —— 改坏了照样能合（审计 2026-11-20）。
#
# 每一条都在干净树 + 干净 node_modules 下实测过：
#   tsc --noEmit 0 / next lint 0（3 warning）/ build 0 / 10 个测试套件全绿。
#
# 注意：本机（开发机）跑不了 `npm run build`（宿主机 .next 属主是 root），
# 但 GitHub runner 是全新 checkout，没有这个问题。
name: app-gates（类型 / lint / 单测 / 构建）

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: app-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: typecheck + lint + tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      # 不留凭据：默认会把 GITHUB_TOKEN 写进 .git/config，后续步骤（PR 里的代码）可读。
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 类型检查
        run: npx tsc --noEmit

      - name: Lint
        run: npx next lint

      # 单测：逐条列出（而不是 npm test 通配），这样哪一条红了在 CI 界面上一眼可见。
      - name: 单测 · AI 标题
        run: npm run test:title
      - name: 单测 · 聊天语音
        run: npm run test:chat
      - name: 单测 · 音频
        run: npm run test:audio
      - name: 单测 · 音频保留
        run: npm run test:retention
      - name: 单测 · TTS
        run: npm run test:tts
      - name: 单测 · ASR Origin
        run: npm run test:asr-origin
      - name: 单测 · 队列上下文隔离
        run: npm run test:queue-ctx
      - name: 单测 · 队列真实接线
        run: npm run test:queue-actor
      - name: 单测 · Markdown 链接白名单
        run: npm run test:safe-href
      - name: 单测 · 初始口令策略
        run: npm run test:bootstrap-admin
      - name: 单测 · 未保存转写拦截
        run: npm run test:unsaved-work
      - name: 单测 · 录音启动取消判定
        run: npm run test:recording-guard

      - name: 生产构建
        run: npm run build

      # 漂移守卫：package.json 里新增的 test:* 必须同步加进本 workflow。
      #
      # 用 node 做**集合比对**，不用 grep：grep 有两个坑 —— 脚本名里的正则元字符没转义
      # （test:a.b 会匹配 test:axb），以及它扫整个文件、注释里提到也会命中（假绿）。
      # 这里只认 `run: npm run test:<name>` 这种行（允许尾随参数），再做集合差。
      - name: 门禁自检 · 每个 test:* 都被跑到
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("node:fs");
          const pkg = require("./package.json");
          const workflow = fs.readFileSync(".github/workflows/app-gates.yml", "utf8");

          // 只认 run: 行；`npm run test:x -- --foo` 也算（允许尾随参数）
          const ran = new Set();
          for (const line of workflow.split("\n")) {
            const m = line.match(/^\s*run:\s*npm run (test:[A-Za-z0-9:_-]+)(?:\s.*)?$/);
            if (m) ran.add(m[1]);
          }

          const wanted = Object.keys(pkg.scripts).filter((k) => k.startsWith("test:"));
          const missing = wanted.filter((k) => !ran.has(k));
          if (missing.length > 0) {
            for (const name of missing) {
              console.error(`::error::package.json 里有 ${name}，但 app-gates.yml 没有跑它`);
            }
            process.exit(1);
          }
          console.log(`门禁自检 OK：${wanted.length} 个 test:* 全部覆盖`);
          NODE
