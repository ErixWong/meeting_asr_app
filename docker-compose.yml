services:
  app:
    # 直接使用官方 node:24-slim 基座，不构建自定义镜像
    # node:24-slim = Debian bookworm (glibc)，满足:
    #   - node:sqlite 内置模块 (Node >= 23.4 免 flag)
    #   - sharp@0.35.3 的 linux-x64 glibc 预编译二进制
    #   - @next/swc-linux-x64-gnu 预编译二进制
    image: node:24-slim
    working_dir: /app
    command: >
      sh -c "
      if ! test -f node_modules/next/package.json; then
        apt-get update && apt-get install -y --no-install-recommends python3 make g++ && rm -rf /var/lib/apt/lists/*;
        npm ci --no-audit --no-fund;
      fi;
      if ! test -f .next/BUILD_ID || find src server public tailwind.config.* postcss.config.* tsconfig.json -newer .next/BUILD_ID -print -quit | grep -q .; then npm run build; fi;
      exec node server/app-server.mjs"
    environment:
      PORT: 3123
      APP_HOST: 0.0.0.0
      # 容器内通过 host.docker.internal 访问宿主机上的 llama.cpp/FunASR/声纹/TTS 容器端口
      TTS_ENDPOINT: ${TTS_ENDPOINT:-http://host.docker.internal:8011}
      # 线上通过域名/IP 访问时，必须把实际 Origin 加进来，否则 WebSocket 握手被拒
      ASR_GATEWAY_ALLOWED_ORIGINS: ${ASR_GATEWAY_ALLOWED_ORIGINS:-http://localhost:3123}
      # 直接通过 HTTP 访问时必须为 false；HTTPS 反向代理部署时设为 true
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      # 反向代理身份透传（如 nginx auth_request / 统一登录），未设时禁用它
      AUTH_PROXY_SHARED_SECRET: ${AUTH_PROXY_SHARED_SECRET:-}
      BOOTSTRAP_ADMIN_ACCOUNT: ${BOOTSTRAP_ADMIN_ACCOUNT:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-admin123}
      # 数据库类型：sqlite（默认，本地零配置）| mysql | mssql（连接外部实例）
      # 外部实例连接参数：DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD
      DB_TYPE: ${DB_TYPE:-sqlite}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-}
      DB_NAME: ${DB_NAME:-}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_ENCRYPT: ${DB_ENCRYPT:-false}
    ports:
      - "3123:3123"
    extra_hosts:
      # 容器内访问宿主机映射端口的统一入口（llama.cpp 8008 / FunASR 10095 / 声纹 10097-98 / TTS 8011）
      - "host.docker.internal:host-gateway"
    volumes:
      # 源码 bind mount
      - .:/app
      # 运行产物单独挂到宿主机 ./.docker 目录，
      # 遮罩宿主机 Windows 的 node_modules / .next (平台二进制不同)，
      # 由容器内 npm ci / npm run build 生成 Linux 版本
      - ./.docker/node_modules:/app/node_modules
      - ./.docker/.next:/app/.next
      # SQLite 数据持久化 (process.cwd()/data)，存于 ./.docker/data
      - ./.docker/data:/app/data
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3123/login').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
